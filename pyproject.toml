[project]
name = "clinnlp"
version = "0.1.0"
description = "Clinical NLP extraction: NER, assertion (negation/uncertainty/temporality/experiencer), MeSH normalization, PHI de-identification, FastAPI service"
requires-python = ">=3.10"
dependencies = ["numpy", "scikit-learn", "python-crfsuite", "fastapi", "uvicorn", "httpx"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
